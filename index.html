    <!--
      AdSense loader. Required on the site for Google's site review.

      IMPORTANT: Auto ads must stay OFF for anglerdeck.com in the AdSense
      console. With Auto ads off this script only loads the library — it does
      not create ad slots — so ads appear solely where <AdBanner> renders an
      <ins class="adsbygoogle">, and that component hides ads from Pro and
      Elite subscribers. Turning Auto ads on would let Google inject ads
      anywhere, including for paying users who were promised an ad-free
      experience.

      Consent Mode defaults are set in src/main.tsx before this runs.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2356680512865218"
      crossorigin="anonymous"
    ></script>
